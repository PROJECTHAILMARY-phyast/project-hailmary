<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PROJECT HAIL MARY</title>


    <!-- 도트 느낌 폰트 -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-pro-webfont@latest/neodgm_pro/style.css"
    >


    <style>

        /* ==================================================
           기본 설정
        ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            background: #05091f;

            color: #ffffff;

            font-family:
                'NeoDunggeunmo Pro',
                monospace;

            overflow: hidden;

        }



        /* ==================================================
           전체 화면
        ================================================== */

        .screen {

            width: 100vw;
            height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #05091f;

        }



        /* ==================================================
           바깥 프레임
        ================================================== */

        .frame {

            width: min(780px, 86vw);

            height: min(470px, 72vh);

            border: 2px solid #ffffff;

            display: flex;

            flex-direction: column;

            padding: 25px 32px;

        }



        /* ==================================================
           상단
        ================================================== */

        .header {

            width: 100%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            font-size: 18px;

            letter-spacing: 2px;

        }



        /* ==================================================
           중앙 영역
        ================================================== */

        .content {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

        }



        /* ==================================================
           입력 영역

           ★ 중요

           전체 입력 구조의 폭을 고정하고
           margin: 0 auto로 중앙 배치.

           따라서 오른쪽 단위의 길이가 달라도
           전체 중심이 흔들리지 않음.
        ================================================== */

        .input-area {

            width: 367px;

            max-width: 100%;

            margin: 0 auto;

            display: flex;

            flex-direction: column;

            gap: 26px;

        }



        /* ==================================================
           입력 한 줄

           구조:

           [라벨][ : ][입력칸][단위]

           각 열의 폭을 고정해서
           두 줄의 ':' 위치를 동일하게 유지.
        ================================================== */

        .input-row {

            width: 367px;

            display: grid;

            grid-template-columns:
                95px
                12px
                170px
                90px;

            align-items: center;

            font-size: 24px;

        }



        /* ==================================================
           라벨

           글자 자체는 오른쪽 정렬.

           따라서

           Distance:
               Fuel:

           처럼 글자 시작 위치는 달라도
           ':'는 같은 위치에 놓임.
        ================================================== */

        .label-text {

            width: 95px;

            text-align: right;

            white-space: nowrap;

        }



        /* ==================================================
           콜론

           ★ 고정된 두 번째 열
        ================================================== */

        .colon {

            width: 12px;

            text-align: center;

        }



        /* ==================================================
           입력칸 영역

           ★ 고정된 세 번째 열
        ================================================== */

        .input-wrap {

            width: 170px;

            display: flex;

            justify-content: center;

            align-items: center;

        }



        /* ==================================================
           입력칸

           ★ 밑줄 길이 동일
           ★ 숫자 가운데 정렬
        ================================================== */

        input {

            width: 170px;

            height: 35px;

            background: transparent;

            border: none;

            border-bottom:
                2px solid #ffffff;

            outline: none;

            color: #ffffff;

            font-family:
                'NeoDunggeunmo Pro',
                monospace;

            font-size: 24px;

            text-align: center;

            padding: 4px 5px;

            border-radius: 0;

        }



        input:focus {

            border-bottom:
                2px solid #ffffff;

        }



        /* ==================================================
           단위

           ★ 네 번째 열도 고정 폭

           Distance:
           × 10⁷ km

           Fuel:
           L

           둘 다 같은 90px 영역을 사용하기 때문에
           전체 입력 구조가 흔들리지 않음.
        ================================================== */

        .unit {

            width: 90px;

            white-space: nowrap;

            margin-left: 8px;

            font-size: 24px;

        }



        /* ==================================================
           ERROR
        ================================================== */

        .error {

            width: 367px;

            min-height: 18px;

            color: #ff3030;

            font-size: 16px;

            line-height: 1.4;

            /*
               콜론 바로 아래쪽의
               입력 영역 기준으로 정렬
            */

            padding-left: 107px;

        }



        /* ==================================================
           ENTER 버튼
        ================================================== */

        .start-button {

            align-self: center;

            margin-top: 2px;

            background: transparent;

            color: #ffffff;

            border:
                1px solid #ffffff;

            font-family:
                'NeoDunggeunmo Pro',
                monospace;

            font-size: 18px;

            padding:
                9px 25px;

            cursor: pointer;

        }



        .start-button:hover {

            background: #ffffff;

            color: #05091f;

        }



        /* ==================================================
           로딩 화면
        ================================================== */

        .loading {

            width: 367px;

            height: 165px;

            position: relative;

            display: flex;

            align-items: center;

            overflow: hidden;

        }



        /* ==================================================
           우주선
        ================================================== */

        .spaceship {

            position: absolute;

            left: -80px;

            width: 64px;

            height: 34px;

            animation:
                fly 5s linear forwards;

        }



        /* 우주선 본체 */

        .ship-body {

            position: absolute;

            left: 12px;

            top: 7px;

            width: 36px;

            height: 18px;

            background: #ffffff;

        }



        /* 우주선 앞부분 */

        .ship-front {

            position: absolute;

            left: 47px;

            top: 10px;

            width: 0;

            height: 0;

            border-top:
                9px solid transparent;

            border-bottom:
                9px solid transparent;

            border-left:
                14px solid #ffffff;

        }



        /* 우주선 날개 */

        .ship-wing {

            position: absolute;

            left: 20px;

            top: 24px;

            width: 18px;

            height: 5px;

            background: #ffffff;

        }



        /* 우주선 불꽃 */

        .ship-fire {

            position: absolute;

            left: 0;

            top: 13px;

            width: 12px;

            height: 8px;

            background: #ff3030;

            animation:
                fire 0.25s infinite alternate;

        }



        @keyframes fire {

            from {
                width: 7px;
            }

            to {
                width: 13px;
            }

        }



        /* ==================================================
           우주선 이동

           왼쪽 → 오른쪽
           5초
           한 번만
        ================================================== */

        @keyframes fly {

            0% {

                left: -80px;

            }

            100% {

                left:
                    calc(100% + 80px);

            }

        }



        /* ==================================================
           결과 화면
        ================================================== */

        .result-box {

            width: 367px;

            min-height: 165px;

            border:
                2px solid #ffffff;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

        }



        .result-text {

            font-size: 25px;

            text-align: center;

            line-height: 1.6;

        }



        /* ==================================================
           타이핑 커서
        ================================================== */

        .cursor {

            display: inline-block;

            width: 10px;

            height: 22px;

            background: #ffffff;

            margin-left: 5px;

            vertical-align: middle;

            animation:
                blink 0.7s infinite;

        }



        @keyframes blink {

            0%,
            50% {

                opacity: 1;

            }

            51%,
            100% {

                opacity: 0;

            }

        }



        /* ==================================================
           모바일
        ================================================== */

        @media (max-width: 600px) {


            .frame {

                width: 88vw;

                height: 65vh;

                padding: 18px;

            }



            .header {

                font-size: 13px;

                letter-spacing: 1px;

            }



            /* ------------------------------------------
               모바일 입력 영역

               전체 폭을 292px로 고정
               → 화면 가운데 배치
            ------------------------------------------ */

            .input-area {

                width: 292px;

                max-width: 100%;

            }



            .input-row {

                width: 292px;

                grid-template-columns:
                    72px
                    10px
                    120px
                    90px;

                font-size: 18px;

            }



            .label-text {

                width: 72px;

            }



            .colon {

                width: 10px;

            }



            .input-wrap {

                width: 120px;

            }



            input {

                width: 120px;

                height: 30px;

                font-size: 18px;

            }



            .unit {

                width: 90px;

                font-size: 18px;

                margin-left: 6px;

            }



            .error {

                width: 292px;

                font-size: 14px;

                padding-left: 82px;

            }



            .loading {

                width: 292px;

            }



            .result-box {

                width: 292px;

            }



            .result-text {

                font-size: 19px;

            }



            .start-button {

                font-size: 16px;

            }

        }

    </style>

</head>



<body>


    <div class="screen">


        <div class="frame">


            <!-- ==================================================
                 상단
            ================================================== -->

            <div class="header">

                <div>
                    PROJECT HAIL MARY
                </div>

                <div>
                    MISSION DATA
                </div>

            </div>



            <!-- ==================================================
                 중앙
            ================================================== -->

            <div class="content">


                <!-- ==================================================
                     입력 화면
                ================================================== -->

                <div
                    class="input-area"
                    id="inputScreen"
                >


                    <!-- Distance -->

                    <div class="input-row">


                        <div class="label-text">
                            Distance
                        </div>


                        <div class="colon">
                            :
                        </div>


                        <div class="input-wrap">

                            <input
                                id="distance"
                                type="text"
                                inputmode="numeric"
                                autocomplete="off"
                            >

                        </div>


                        <span class="unit">
                            × 10⁷ km
                        </span>


                    </div>



                    <!-- Distance ERROR -->

                    <div
                        id="distanceError"
                        class="error"
                    ></div>



                    <!-- Fuel -->

                    <div class="input-row">


                        <div class="label-text">
                            Fuel
                        </div>


                        <div class="colon">
                            :
                        </div>


                        <div class="input-wrap">

                            <input
                                id="fuel"
                                type="text"
                                inputmode="numeric"
                                autocomplete="off"
                            >

                        </div>


                        <span class="unit">
                            L
                        </span>


                    </div>



                    <!-- Fuel ERROR -->

                    <div
                        id="fuelError"
                        class="error"
                    ></div>



                    <!-- ENTER -->

                    <button
                        class="start-button"
                        onclick="checkAnswer()"
                    >
                        ENTER
                    </button>


                </div>



                <!-- ==================================================
                     우주선 로딩 화면
                ================================================== -->

                <div
                    id="loadingScreen"
                    class="loading"
                    style="display: none;"
                >


                    <div class="spaceship">


                        <div
                            class="ship-fire"
                        ></div>


                        <div
                            class="ship-body"
                        ></div>


                        <div
                            class="ship-front"
                        ></div>


                        <div
                            class="ship-wing"
                        ></div>


                    </div>


                </div>



                <!-- ==================================================
                     결과 화면
                ================================================== -->

                <div
                    id="resultScreen"
                    class="result-box"
                    style="display: none;"
                >


                    <div
                        id="resultText"
                        class="result-text"
                    ></div>


                    <span
                        id="cursor"
                        class="cursor"
                    ></span>


                </div>


            </div>


        </div>

    </div>



    <script>


        /* ==================================================
           정답
        ================================================== */

        const DISTANCE_ANSWER =
            "134478";


        const FUEL_ANSWER =
            "15876";



        /* ==================================================
           정답 확인
        ================================================== */

        function checkAnswer() {


            const distance =
                document
                    .getElementById("distance")
                    .value
                    .trim();


            const fuel =
                document
                    .getElementById("fuel")
                    .value
                    .trim();


            const distanceError =
                document
                    .getElementById(
                        "distanceError"
                    );


            const fuelError =
                document
                    .getElementById(
                        "fuelError"
                    );


            distanceError.innerHTML = "";

            fuelError.innerHTML = "";


            let correct = true;



            /* Distance 확인 */

            if (
                distance !==
                DISTANCE_ANSWER
            ) {


                distanceError.innerHTML =
                    "ERROR<br>" +
                    "Distance 값이 잘못되었습니다.";


                correct = false;

            }



            /* Fuel 확인 */

            if (
                fuel !==
                FUEL_ANSWER
            ) {


                fuelError.innerHTML =
                    "ERROR<br>" +
                    "Fuel 값이 잘못되었습니다.";


                correct = false;

            }



            /* 둘 다 정답 */

            if (correct) {

                startMission();

            }

        }



        /* ==================================================
           미션 시작
        ================================================== */

        function startMission() {


            const inputScreen =
                document
                    .getElementById(
                        "inputScreen"
                    );


            const loadingScreen =
                document
                    .getElementById(
                        "loadingScreen"
                    );


            inputScreen.style.display =
                "none";


            loadingScreen.style.display =
                "flex";


            /*
               우주선 이동이 끝난 뒤
               결과 표시
            */

            setTimeout(
                function() {


                    loadingScreen.style.display =
                        "none";


                    showResult();


                },
                5100
            );

        }



        /* ==================================================
           결과 화면
        ================================================== */

        function showResult() {


            const resultScreen =
                document
                    .getElementById(
                        "resultScreen"
                    );


            const resultText =
                document
                    .getElementById(
                        "resultText"
                    );


            const cursor =
                document
                    .getElementById(
                        "cursor"
                    );


            resultScreen.style.display =
                "flex";


            resultText.textContent =
                "";


            cursor.style.display =
                "inline-block";



            const message =
                "로키에게까지는 1637시간이 걸립니다.";


            let index = 0;



            const typing =
                setInterval(
                    function() {


                        if (
                            index <
                            message.length
                        ) {


                            resultText.textContent +=
                                message[index];


                            index++;


                        }

                        else {


                            clearInterval(
                                typing
                            );

                        }


                    },
                    110
                );

        }



        /* ==================================================
           Enter 키
        ================================================== */

        document.addEventListener(
            "keydown",
            function(event) {


                if (
                    event.key ===
                    "Enter"
                ) {


                    const inputScreen =
                        document
                            .getElementById(
                                "inputScreen"
                            );


                    if (
                        inputScreen.style.display
                        !== "none"
                    ) {


                        checkAnswer();

                    }

                }

            }
        );

    </script>


</body>

</html>
